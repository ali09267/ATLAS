{% extends 'shop/basic.html' %}
{% block content %}
{% load static %}

<div class="container my-4">
    <div class="row">
    <div class="col-md-4">
        <div class="row">
            <img src="/media/{{ product.image }}" class="w-200 h-200"/> 
        </div>
        <button class="btn btn-primary cart me-2 mt-3" id="{{ product.id }}">Add To Cart</button>
        <button class="btn btn-primary cart me-2 mt-3" id="vd{{ product.id }}">View Details</button>
    </div>
    <div class="col-md-8">
        <h3>{{ product.product_name }}</h3>
        <p><b>Price:</b> ${{ product.price }}</p>
        <p>{{ product.desc }}</p>
    </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
   
    if(localStorage.getItem('cart') == null){
        var cart = {};
    }
    else{
        cart = JSON.parse(localStorage.getItem('cart'));
        document.getElementById('cartLengthDisplay').innerText = Object.keys(cart).length;
    }
    $('.cart').click(function(){
        
        var idStr=this.id.toString();

        if(cart[idStr] != undefined){
            cart[idStr] = cart[idStr] + 1;
        }
        else{
            cart[idStr] = 1;
        }
        console.log(cart);
       localStorage.setItem('cart', JSON.stringify(cart));
       document.getElementById('cartLengthDisplay').innerText = Object.keys(cart).length;
    });

    $(document).ready(function(){
    $('#popcart').popover();
});
    //$('#popcart').popover('show');
    // document.getElementById('popcart').setAttribute('data-content', 'hello');
    document.getElementById('popcart').setAttribute('data-bs-content', 'Your cart has ' + Object.keys(cart).length + ' items.');
    console.log("MY CART ITEMS",JSON.stringify(cart));
</script>

{% endblock %}
