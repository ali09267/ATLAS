{% extends 'shop/basic.html' %}
{% block content %}
{% load static %}
<div class="container mt-4">
    <h3>Contact Us</h3>
    <form method="POST">
        {% csrf_token %}
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="text" class="form-control" id="name" name="name" aria-describedby="emailHelp" placeholder="Enter your Name">
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="text" class="form-control" id="email" name="email" aria-describedby="emailHelp" placeholder="Enter your Email">
        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
  </div>
  <div class="mb-3">
    <label for="phone" class="form-label">Phone No</label>
    <input type="text" class="form-control" id="phone" name="phone" aria-describedby="emailHelp" placeholder="Enter your Phone Number">
  </div>
  <div class="mb-3">
    <label for="desc" class="form-label">Description</label>
    <textarea class="form-control" id="desc" name="desc" rows="3" placeholder="How can we help you?"></textarea>
  </div>
  <br>
  <button type="submit" class="btn btn-success mb-3">Submit</button>
</form>
</div>
{% endblock %}
